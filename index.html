<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producción de eventos</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;@apply bg-stone-100 text-stone-900}
.btn{@apply px-3 py-2 rounded-md text-sm font-semibold bg-teal-800 text-white hover:bg-teal-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700}
.btn2{@apply px-3 py-2 rounded-md text-sm font-semibold border border-stone-300 bg-white hover:bg-stone-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal-700}
.inp{@apply w-full border border-stone-300 rounded-md px-3 py-2 text-sm bg-white focus:outline-teal-700}
.lbl{@apply block text-sm font-semibold mt-3 mb-1}
.card{@apply bg-white rounded-lg border border-stone-200 mb-4}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60]"></div>
<script>
/* ===== CONFIGURACIÓN: rellena estas dos constantes ===== */
const SUPABASE_URL = 'https://ouoxrfkrmgiuhvqtmpvj.supabase.co
NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_TsP-mB2ZtOhYrcQ11wj_iA_QG-YQN2x';
const SUPABASE_ANON_KEY = 'sb_publishable_TsP-mB2ZtOhYrcQ11wj_iA_QG-YQN2x';

/* ===== ALMACENAMIENTO (escala a 5 TB) =====
   La base de datos de Supabase guarda SOLO el texto/tablas de tus Excel (recetas, eventos, hojas de producción).
   Los archivos pesados (fotos, PDF, Excel originales, vídeos) NO deben ir a Postgres: irán a un almacenamiento
   masivo externo (Amazon S3 o Backblaze B2) y en la base solo se guardará la URL resultante. */
async function subirArchivoExterno(file, ruta) {
  // 1) Pide una URL firmada a una Edge Function de Supabase (las claves de S3/B2 viven en sus secrets, nunca aquí):
  //    const { data, error } = await sb.functions.invoke('firmar-subida', { body: { ruta, tipo: file.type } });
  //    if (error) throw error;
  // 2) Sube el archivo directo al bucket:
  //    await fetch(data.url, { method: 'PUT', body: file, headers: { 'Content-Type': file.type } });
  // 3) Devuelve la URL pública/privada para guardarla en una columna de texto (ej. recetas.foto_url):
  //    return data.publicUrl;
  throw new Error('Almacenamiento externo aún sin configurar. Conecta S3 o B2 en subirArchivoExterno().');
}

const MAIL = { admin: 'admin@produccion.local', cocina: 'cocina@produccion.local' };
const ESTADOS = ['Pendiente', 'En Cocina', 'Listo para Enviar'];
const EC = { 'Pendiente': 'bg-stone-200 text-stone-800', 'En Cocina': 'bg-amber-200 text-amber-900', 'Listo para Enviar': 'bg-emerald-200 text-emerald-900' };
const sb = supabase.createClient(SUPABASE_URL || 'https://placeholder.supabase.co', SUPABASE_ANON_KEY || 'placeholder');
const S = { rol: null, tab: 'produccion', q: '', ev: '', fecha: '', recetas: [], eventos: [], hojas: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const admin = () => S.rol === 'admin';
const hoy = () => new Date().toISOString().slice(0, 10);
const num = n => Number(n).toLocaleString('es-ES', { maximumFractionDigits: 2 });
function toast(m, err) {
  $('toast').innerHTML = `<div class="px-4 py-2 rounded-md text-sm font-semibold text-white ${err ? 'bg-red-700' : 'bg-teal-800'}">${esc(m)}</div>`;
  setTimeout(() => $('toast').innerHTML = '', 3500);
}

/* ===== ACCESO ===== */
function loginView() {
  $('app').innerHTML = `<main class="min-h-screen grid place-items-center p-4"><form id="lf" class="card w-full max-w-sm p-6">
    <h1 class="text-2xl font-extrabold">Producción de eventos</h1><p class="text-sm text-stone-600 mt-1">Entra con tu usuario de cocina o administración.</p>
    <label class="lbl" for="u">Usuario</label><input id="u" class="inp" autocomplete="username" required>
    <label class="lbl" for="p">Contraseña</label><input id="p" type="password" class="inp" autocomplete="current-password" required>
    <button class="btn w-full mt-5">Entrar</button></form></main>`;
  $('lf').onsubmit = async e => {
    e.preventDefault();
    const email = MAIL[$('u').value.trim().toLowerCase()];
    if (!email) return toast('Usuario no válido. Usa "admin" o "cocina".', 1);
    const { data, error } = await sb.auth.signInWithPassword({ email, password: $('p').value });
    if (error) return toast('Usuario o contraseña incorrectos.', 1);
    enter(data.user.email);
  };
}
async function enter(email) {
  S.rol = email === MAIL.admin ? 'admin' : 'cocina';
  S.tab = 'produccion'; S.fecha = admin() ? '' : hoy();
  await load(); render();
}
async function salir() { await sb.auth.signOut(); S.rol = null; loginView(); }
async function load() {
  const [e, r, h] = await Promise.all([
    sb.from('eventos').select('*').order('fecha', { ascending: false }),
    sb.from('recetas').select('*').order('nombre'),
    sb.from('hojas_produccion').select('*').order('fecha_produccion', { ascending: false })]);
  [e, r, h].forEach(x => x.error && toast(x.error.message, 1));
  S.eventos = e.data || []; S.recetas = r.data || []; S.hojas = h.data || [];
}

/* ===== ESTRUCTURA ===== */
function render() {
  const tabs = [['produccion', 'Producción'], ['recetas', 'Recetas'], ['eventos', 'Eventos'], ...(admin() ? [['archivos', 'Archivos']] : [])];
  const v = { produccion: vProd, recetas: vRec, eventos: vEv, archivos: vArch }[S.tab]();
  $('app').innerHTML = `<header class="bg-teal-950 text-white"><div class="max-w-5xl mx-auto px-4 pt-4 flex justify-between items-center">
    <h1 class="font-extrabold text-xl">Producción de eventos</h1>
    <div class="flex items-center gap-3 text-sm"><span class="px-2 py-1 rounded bg-white/15 font-semibold">${admin() ? 'Administración' : 'Cocina'}</span><button class="underline" onclick="salir()">Salir</button></div></div>
    <nav class="max-w-5xl mx-auto px-4 mt-3 flex gap-1 overflow-x-auto">${tabs.map(([k, t]) =>
      `<button onclick="S.tab='${k}';render()" class="px-4 py-2 text-sm font-semibold rounded-t-md whitespace-nowrap ${S.tab === k ? 'bg-stone-100 text-teal-950' : 'text-teal-100 hover:bg-white/10'}">${t}</button>`).join('')}</nav></header>
    <main class="max-w-5xl mx-auto p-4">${v}</main>`;
}
function modal(t, body, onsave) {
  $('modal').innerHTML = `<div class="fixed inset-0 bg-black/50 overflow-auto p-4 z-50"><div class="bg-white rounded-lg w-full max-w-xl p-5 mx-auto mt-6">
    <h3 class="font-extrabold text-lg">${t}</h3>${body}
    <div class="flex justify-end gap-2 mt-5"><button class="btn2" onclick="closeM()">Cancelar</button><button class="btn" id="ok">Guardar</button></div></div></div>`;
  $('ok').onclick = onsave;
}
const closeM = () => $('modal').innerHTML = '';
const field = (id, label, val = '', type = 'text') => `<label class="lbl" for="${id}">${label}</label><input id="${id}" type="${type}" class="inp" value="${esc(val)}">`;
const area = (id, label, val = '', ph = '') => `<label class="lbl" for="${id}">${label}</label><textarea id="${id}" rows="7" class="inp font-mono" placeholder="${esc(ph)}">${esc(val)}</textarea>`;
async function guardar(tabla, id, obj) {
  const { error } = await (id ? sb.from(tabla).update(obj).eq('id', id) : sb.from(tabla).insert(obj));
  if (error) return toast(error.message, 1);
  closeM(); await load(); render(); toast('Guardado');
}
async function del(tabla, id) {
  if (!confirm('¿Borrar definitivamente?')) return;
  const { error } = await sb.from(tabla).delete().eq('id', id);
  if (error) return toast(error.message, 1);
  await load(); render(); toast('Borrado');
}
const btnsAdmin = (t, id, f) => admin() ? `<div class="flex gap-2"><button class="btn2" onclick="${f}('${id}')">Editar</button><button class="btn2" onclick="del('${t}','${id}')">Borrar</button></div>` : '';

/* ===== PRODUCCIÓN ===== */
function vProd() {
  const hs = S.hojas.filter(h => (!S.fecha || h.fecha_produccion === S.fecha) && (!S.ev || h.evento_id === S.ev));
  return `<div class="flex flex-wrap gap-2 items-end mb-4">
    <div><label class="lbl !mt-0">Fecha de producción</label><input type="date" class="inp" value="${S.fecha}" onchange="S.fecha=this.value;render()"></div>
    <div><label class="lbl !mt-0">Evento</label><select class="inp" onchange="S.ev=this.value;render()"><option value="">Todos</option>${S.eventos.map(e => `<option value="${e.id}" ${S.ev === e.id ? 'selected' : ''}>${esc(e.nombre)}</option>`).join('')}</select></div>
    ${S.fecha ? '<button class="btn2" onclick="S.fecha=\'\';render()">Ver todas las fechas</button>' : ''}
    <div class="grow"></div>${admin() ? '<button class="btn" onclick="formHoja()">Nueva hoja</button>' : ''}</div>
    ${hs.map(cardHoja).join('') || '<p class="text-stone-600">No hay hojas de producción con este filtro.</p>'}`;
}
function cardHoja(h) {
  const e = S.eventos.find(x => x.id === h.evento_id) || {}, pax = e.pax || 0;
  return `<section class="card"><header class="flex flex-wrap justify-between gap-2 p-4 border-b border-stone-200">
    <div><h3 class="font-extrabold text-lg">${esc(h.nombre)}</h3><p class="text-sm text-stone-600">Evento: ${esc(e.nombre || 'sin evento')}, ${pax} pax, producción ${h.fecha_produccion || 'sin fecha'}</p></div>${btnsAdmin('hojas_produccion', h.id, 'formHoja')}</header>
    <ul>${h.platos.map((p, i) => {
      const st = (h.estados || {})[i] || 'Pendiente';
      return `<li class="p-4 border-b border-stone-100 last:border-0"><div class="flex justify-between gap-3 items-center"><strong>${esc(p.nombre)}</strong>
        <select aria-label="Estado de ${esc(p.nombre)}" class="rounded-md px-2 py-1 text-sm font-semibold ${EC[st]}" onchange="setEstado('${h.id}',${i},this.value)">${ESTADOS.map(s => `<option ${s === st ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <details class="mt-1 text-sm text-stone-700"><summary class="cursor-pointer">Cantidades para ${pax} pax</summary><ul class="mt-1">${p.ingredientes.map(g =>
          `<li class="flex justify-between max-w-md"><span>${esc(g.n)}</span><span>${num(g.v * pax)} ${g.u ? 'und' : 'g'}</span></li>`).join('')}</ul></details></li>`;
    }).join('')}</ul></section>`;
}
async function setEstado(id, i, v) {
  const h = S.hojas.find(x => x.id === id), estados = { ...(h.estados || {}), [i]: v };
  const { data, error } = await sb.from('hojas_produccion').update({ estados }).eq('id', id).select();
  if (error || !data.length) return toast(error ? error.message : 'No tienes permiso para cambiar el estado.', 1);
  h.estados = estados; render(); toast('Estado actualizado');
}
// Formato de platos: "Plato | Ingrediente=gramos por pax, Ingrediente=1u"  (la "u" indica unidades)
const parsePlatos = t => t.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
  const [n, r = ''] = l.split('|');
  return { nombre: n.trim(), ingredientes: r.split(',').map(x => x.trim()).filter(Boolean).map(x => { const [a, b = ''] = x.split('='); return { n: a.trim(), v: parseFloat(b) || 0, u: /u\s*$/i.test(b) }; }) };
});
const platosTxt = p => p.map(x => x.nombre + ' | ' + x.ingredientes.map(i => `${i.n}=${i.v}${i.u ? 'u' : ''}`).join(', ')).join('\n');
function formHoja(id) {
  const h = S.hojas.find(x => x.id === id) || { platos: [] };
  modal(id ? 'Editar hoja de producción' : 'Nueva hoja de producción',
    `<label class="lbl" for="f_ev">Evento</label><select id="f_ev" class="inp">${S.eventos.map(e => `<option value="${e.id}" ${h.evento_id === e.id ? 'selected' : ''}>${esc(e.nombre)} (${e.pax} pax)</option>`).join('')}</select>` +
    field('f_n', 'Menú (ej. Finger Opción 1)', h.nombre) + field('f_f', 'Fecha de producción', h.fecha_produccion, 'date') +
    area('f_p', 'Platos (uno por línea)', platosTxt(h.platos), 'Ensalada Cobb | Bacon=10, Dados de pollo=40, Tomate cherry=1u'),
    () => {
      if (!$('f_ev').value || !$('f_n').value.trim()) return toast('Elige un evento y escribe el nombre del menú.', 1);
      guardar('hojas_produccion', id, { evento_id: $('f_ev').value, nombre: $('f_n').value.trim(), fecha_produccion: $('f_f').value || null, platos: parsePlatos($('f_p').value) });
    });
}

/* ===== RECETAS ===== */
function vRec() {
  const q = S.q.toLowerCase(), rs = S.recetas.filter(r => (r.nombre + ' ' + (r.area || '')).toLowerCase().includes(q));
  return `<div class="flex gap-2 mb-4"><input class="inp" type="search" placeholder="Buscar receta o área" value="${esc(S.q)}" oninput="S.q=this.value;render();const i=document.querySelector('[type=search]');i.focus();i.setSelectionRange(99,99)">${admin() ? '<button class="btn whitespace-nowrap" onclick="formRec()">Nueva receta</button>' : ''}</div>
    ${rs.map(r => { const tot = r.ingredientes.reduce((a, i) => a + i.g, 0);
      return `<section class="card p-4"><div class="flex flex-wrap justify-between gap-2"><div><h3 class="font-extrabold text-lg">${esc(r.nombre)}</h3>
        <p class="text-sm text-stone-600">${esc(r.area || 'Sin área')}, elaborada por ${esc(r.elaborado_por || 'sin indicar')}, ${num(tot)} g, ${r.porciones || '?'} porciones</p></div>${btnsAdmin('recetas', r.id, 'formRec')}</div>
        <details class="mt-2 text-sm"><summary class="cursor-pointer font-semibold">Ingredientes</summary><table class="mt-2 w-full max-w-md"><tbody>${r.ingredientes.map(i =>
          `<tr class="border-b border-stone-100"><td class="py-1">${esc(i.n)}</td><td class="text-right">${num(i.g)} g</td><td class="text-right text-stone-500">${tot ? num(i.g / tot * 100) : 0}%</td></tr>`).join('')}</tbody></table>${r.notas ? `<p class="mt-2 text-stone-700">${esc(r.notas)}</p>` : ''}</details></section>`; }).join('') || '<p class="text-stone-600">No hay recetas que coincidan.</p>'}`;
}
function formRec(id) {
  const r = S.recetas.find(x => x.id === id) || { ingredientes: [] };
  modal(id ? 'Editar receta' : 'Nueva receta',
    field('r_n', 'Nombre del producto', r.nombre) + field('r_a', 'Área (ej. Coffee break / Catering)', r.area) + field('r_e', 'Elaborado por', r.elaborado_por) +
    field('r_f', 'Fecha', r.fecha, 'date') + field('r_p', 'Porciones', r.porciones, 'number') +
    area('r_i', 'Ingredientes (uno por línea: nombre | gramos)', r.ingredientes.map(i => `${i.n} | ${i.g}`).join('\n'), 'Aceite de oliva suave | 7500') +
    `<label class="lbl" for="r_o">Notas</label><textarea id="r_o" rows="2" class="inp">${esc(r.notas)}</textarea>`,
    () => {
      if (!$('r_n').value.trim()) return toast('El nombre es obligatorio.', 1);
      const ing = $('r_i').value.split('\n').map(l => l.split('|')).filter(a => a[0].trim()).map(a => ({ n: a[0].trim(), g: parseFloat(a[1]) || 0 }));
      guardar('recetas', id, { nombre: $('r_n').value.trim(), area: $('r_a').value, elaborado_por: $('r_e').value, fecha: $('r_f').value || null,
        porciones: parseFloat($('r_p').value) || null, rendimiento_g: ing.reduce((a, i) => a + i.g, 0), ingredientes: ing, notas: $('r_o').value });
    });
}

/* ===== EVENTOS ===== */
function vEv() {
  return `${admin() ? '<div class="flex justify-end mb-4"><button class="btn" onclick="formEv()">Nuevo evento</button></div>' : ''}
    ${S.eventos.map(e => `<section class="card p-4 flex flex-wrap justify-between gap-2"><div><h3 class="font-extrabold text-lg">${esc(e.nombre)}</h3>
      <p class="text-sm text-stone-600">${e.fecha || 'sin fecha'}, ${e.pax} pax, ${esc(e.lugar || 'sin lugar')}</p>${e.notas ? `<p class="text-sm mt-1">${esc(e.notas)}</p>` : ''}</div>${btnsAdmin('eventos', e.id, 'formEv')}</section>`).join('') || '<p class="text-stone-600">Aún no hay eventos.</p>'}`;
}
function formEv(id) {
  const e = S.eventos.find(x => x.id === id) || {};
  modal(id ? 'Editar evento' : 'Nuevo evento', field('e_n', 'Nombre del evento', e.nombre) + field('e_f', 'Fecha', e.fecha, 'date') + field('e_p', 'Pax', e.pax ?? 0, 'number') + field('e_l', 'Lugar', e.lugar) +
    `<label class="lbl" for="e_o">Notas</label><textarea id="e_o" rows="3" class="inp">${esc(e.notas)}</textarea>`,
    () => {
      if (!$('e_n').value.trim()) return toast('El nombre es obligatorio.', 1);
      guardar('eventos', id, { nombre: $('e_n').value.trim(), fecha: $('e_f').value || null, pax: parseInt($('e_p').value) || 0, lugar: $('e_l').value, notas: $('e_o').value });
    });
}

/* ===== ARCHIVOS (almacenamiento externo) ===== */
function vArch() {
  return `<section class="card p-4 max-w-xl"><h3 class="font-extrabold text-lg">Archivos pesados</h3>
    <p class="text-sm text-stone-600 mt-1">Fotos, PDF y Excel originales se guardarán en un almacenamiento externo (S3 o Backblaze B2). Aquí solo se conserva el enlace.</p>
    <input id="fa" type="file" class="inp mt-3"><button class="btn mt-3" onclick="subir()">Subir archivo</button></section>`;
}
async function subir() {
  const f = $('fa').files[0]; if (!f) return toast('Elige un archivo primero.', 1);
  try { toast('Subido: ' + await subirArchivoExterno(f, 'eventos/' + Date.now() + '_' + f.name)); } catch (e) { toast(e.message, 1); }
}

/* ===== ARRANQUE ===== */
(async () => {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) { $('app').innerHTML = '<p class="p-6 font-semibold">Rellena SUPABASE_URL y SUPABASE_ANON_KEY al inicio del script.</p>'; return; }
  const { data: { session } } = await sb.auth.getSession();
  session ? enter(session.user.email) : loginView();
})();
</script>
</body>
</html>
